# Local development PostgreSQL only.
# No application containers are defined here.
# Copy .env.example to .env in the project root to override the placeholders below.

services:
  postgres:
    image: postgres:16
    container_name: smartquery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartquery_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev}
    ports:
      - "5432:5432"
    volumes:
      - smartquery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartquery} -d ${POSTGRES_DB:-smartquery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  smartquery_postgres_data:
